<div id="gallery-sidebar" class="fixed inset-y-0 right-0 w-96 bg-slate-900 border-l border-slate-700 shadow-2xl z-40 transform translate-x-full transition-transform duration-300 flex flex-col" onload="setTimeout(()=>this.classList.remove('translate-x-full'), 50)">
    <div class="p-4 border-b border-slate-800 flex justify-between items-center bg-slate-900/90 backdrop-blur">
        <h2 class="text-xl font-bold text-white flex items-center">
            <svg class="w-5 h-5 mr-2 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
            Galeria de Capturas
        </h2>
        <button onclick="document.getElementById('gallery-sidebar').classList.add('translate-x-full'); setTimeout(() => document.getElementById('gallery-sidebar').remove(), 300)" class="text-slate-400 hover:text-white p-2 rounded-lg hover:bg-slate-800 transition-colors">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
    </div>
    
    <div class="flex-1 overflow-y-auto p-4 space-y-4">
        {{if not .}}
            <div class="text-center text-slate-500 mt-10">
                <svg class="w-16 h-16 mx-auto mb-4 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                <p>Nenhuma captura encontrada.</p>
                <p class="text-xs mt-2">Arquivos salvos aparecerão aqui.</p>
            </div>
        {{else}}
            {{range .}}
            <div class="bg-slate-800 rounded-lg overflow-hidden border border-slate-700 group hover:border-indigo-500 transition-colors">
                {{if .IsVideo}}
                <!-- Video Item -->
                <div class="p-3 flex justify-between items-start">
                    <div class="flex items-center space-x-3">
                        <div class="bg-red-500/20 text-red-400 p-2 rounded-lg">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                        </div>
                        <div class="overflow-hidden">
                            <p class="text-sm font-semibold text-white truncate w-40" title="{{.Name}}">{{.Name}}</p>
                            <p class="text-xs text-slate-400">{{.ModTime}} • {{.Size}}</p>
                        </div>
                    </div>
                    <a href="{{.Path}}" download class="text-indigo-400 hover:text-indigo-300">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    </a>
                </div>
                {{else}}
                <!-- Image Item -->
                <div class="relative h-40 bg-black cursor-pointer group-hover:opacity-90" onclick="openModal('{{.Path}}', '{{.Name}}')">
                    <img src="{{.Path}}" class="w-full h-full object-cover" loading="lazy" alt="{{.Name}}">
                    <div class="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 bg-black/40 transition-opacity">
                        <svg class="w-10 h-10 text-white/80" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v3m0 0v3m0-3h3m-3 0H7"></path></svg>
                    </div>
                </div>
                <div class="p-3 bg-slate-800 flex justify-between items-center">
                    <div class="overflow-hidden">
                        <p class="text-xs font-semibold text-white truncate w-40" title="{{.Name}}">{{.Name}}</p>
                        <p class="text-xs text-slate-400">{{.ModTime}} • {{.Size}}</p>
                    </div>
                    <a href="{{.Path}}" download class="text-indigo-400 hover:text-indigo-300">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    </a>
                </div>
                {{end}}
            </div>
            {{end}}
        {{end}}
    </div>
    <script>
        // Animação de entrada
        setTimeout(() => {
            document.getElementById('gallery-sidebar').classList.remove('translate-x-full');
        }, 10);
    </script>
</div>
